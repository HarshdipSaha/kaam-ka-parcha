services:
  - type: web
    name: kaam-ka-parcha
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: API_KEY            # Gnani Prisma/Timbre key — set in the dashboard, never commit
        sync: false
      - key: EXTRACTOR_BASE_URL
        sync: false
      - key: EXTRACTOR_API_KEY
        sync: false
      - key: EXTRACTOR_MODEL
        sync: false   # name of the model served by your OpenAI-compatible endpoint
      - key: EXTRACTOR_PROVIDER
        value: openai   # set to evon only when serving Gnani Evon v3.3
      - key: TTS_VOICE
        value: Vikrant
