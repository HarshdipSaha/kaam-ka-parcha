services:
  - type: web
    name: kaam-ka-parcha
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: API_KEY            # Gnani Prisma/Timbre key — set in the dashboard, never commit
        sync: false
      - key: EXTRACTOR_BASE_URL
        sync: false
      - key: EXTRACTOR_API_KEY
        sync: false
      - key: EXTRACTOR_MODEL
        value: gnani-evon-v3.3
      - key: EXTRACTOR_PROVIDER
        value: evon
      # Public-demo guards (src/parcha/guard.py); behind Render's proxy trust the appended client IP.
      - key: TRUST_PROXY
        value: "1"
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: SESSIONS_PER_IP_PER_HOUR
        value: "20"
      - key: MAX_TOTAL_SESSIONS
        value: "300"
      - key: DEMO_ACCESS_CODE
        sync: false   # optional; leave empty to keep the demo open
      - key: TTS_VOICE
        value: Vikrant
