[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaam-ka-parcha"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6",
  "httpx>=0.27", "python-dotenv>=1.0", "python-multipart>=0.0.9",
  "jinja2>=3.1", "numpy>=1.26", "reportlab>=4.0", "pypdf>=4.0",
  "websockets>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
e2e = ["pytest>=8.0", "playwright>=1.45", "pytest-playwright>=0.5"]
bench = ["pyarrow>=15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
parcha = ["templates/*.html", "static/*.js", "static/*.css", "static/*.svg", "assets/*.wav"]


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: browser tests (Playwright on offline fakes, zero credits)"]
addopts = "-m 'not e2e'"
