name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Ubuntu's apt FFmpeg has no AMR-NB encoder (libopencore_amrnb); the static build does.
      - name: Install FFmpeg (audio processing, G.711 and AMR-NB degradation)
        uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Show FFmpeg codecs used by the lab
        run: ffmpeg -hide_banner -encoders | grep -E "pcm_mulaw|opencore_amrnb"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Offline suite (no credentials, no speech credits)
        run: python -m pytest -q
